<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#0f0f18"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="50%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
    <linearGradient id="cpuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#c23152"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f39c12" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f39c12" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f39c12" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="40" x2="1280" y2="40"/><line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="200" x2="1280" y2="200"/><line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="280" x2="1280" y2="280"/>
    <line x1="80" y1="0" x2="80" y2="320"/><line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="240" y1="0" x2="240" y2="320"/><line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/><line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="560" y1="0" x2="560" y2="320"/><line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="720" y1="0" x2="720" y2="320"/><line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="880" y1="0" x2="880" y2="320"/><line x1="960" y1="0" x2="960" y2="320"/>
    <line x1="1040" y1="0" x2="1040" y2="320"/><line x1="1120" y1="0" x2="1120" y2="320"/>
    <line x1="1200" y1="0" x2="1200" y2="320"/>
  </g>

  <!-- Circuit traces (decorative) -->
  <g stroke="#f39c12" stroke-opacity="0.1" stroke-width="1.5" fill="none">
    <path d="M0,160 H40"/>
    <path d="M240,160 H300"/>
    <path d="M980,160 H1020"/>
    <path d="M1280,160 H1240"/>
    <path d="M60,30 V60 H100 V30"/>
    <path d="M1180,290 V260 H1220 V290"/>
  </g>

  <!-- ===== LEFT PANEL: Mini architecture (x=40..240, w=200) ===== -->

  <!-- Outer frame -->
  <rect x="40" y="40" width="200" height="240" rx="8" fill="none" stroke="#222" stroke-width="1"/>

  <!-- Software strip -->
  <rect x="48" y="48" width="184" height="22" rx="3" fill="#1a1a2e" stroke="#2a2a4a" stroke-width="0.8"/>
  <text x="140" y="63" text-anchor="middle" fill="#a8d8ea" font-family="Consolas,monospace" font-size="9.5">FreeRTOS + Shell</text>

  <!-- Arrow -->
  <line x1="140" y1="70" x2="140" y2="78" stroke="#f39c12" stroke-opacity="0.4" stroke-width="1.5"/>
  <polygon points="137,77 143,77 140,82" fill="#f39c12" fill-opacity="0.4"/>

  <!-- CPU block -->
  <rect x="48" y="82" width="184" height="28" rx="5" fill="url(#cpuGrad)"/>
  <text x="140" y="100" text-anchor="middle" fill="white" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700">NEORV32 RV32IMC</text>

  <!-- Arrow -->
  <line x1="140" y1="110" x2="140" y2="116" stroke="#f39c12" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Wishbone bus -->
  <rect x="48" y="116" width="184" height="12" rx="3" fill="url(#busGrad)"/>
  <text x="140" y="126" text-anchor="middle" fill="#1a1a1a" font-family="Consolas,monospace" font-size="7.5" font-weight="700" letter-spacing="1">WISHBONE 1/12</text>

  <!-- Arrow -->
  <line x1="140" y1="128" x2="140" y2="136" stroke="#f39c12" stroke-opacity="0.4" stroke-width="1.5"/>
  <polygon points="137,135 143,135 140,140" fill="#f39c12" fill-opacity="0.4"/>

  <!-- Peripheral row 1 — 5 blocks (active only) -->
  <g font-family="Consolas,monospace" font-size="7.5" font-weight="600" text-anchor="middle">
    <rect x="48"  y="140" width="35" height="20" rx="3" fill="#1b2838" stroke="#2a475e" stroke-width="0.8"/>
    <text x="65"  y="154" fill="#66c0f4">SDRAM</text>

    <rect x="86"  y="140" width="35" height="20" rx="3" fill="#2d1b38" stroke="#4a2d5e" stroke-width="0.8"/>
    <text x="103" y="154" fill="#c866f4">VGA</text>

    <rect x="124" y="140" width="35" height="20" rx="3" fill="#38291b" stroke="#5e4a2d" stroke-width="0.8"/>
    <text x="141" y="154" fill="#f4c866">Con</text>

    <rect x="162" y="140" width="35" height="20" rx="3" fill="#38291b" stroke="#5e4a2d" stroke-width="0.8"/>
    <text x="179" y="154" fill="#f4c866">GPU</text>

    <rect x="200" y="140" width="32" height="20" rx="3" fill="#38291b" stroke="#5e4a2d" stroke-width="0.8"/>
    <text x="216" y="154" fill="#f4c866">Exp</text>

    <!-- Peripheral row 2 — 4 blocks (active) -->
    <rect x="48"  y="164" width="38" height="20" rx="3" fill="#1b3828" stroke="#2d5e3e" stroke-width="0.8"/>
    <text x="67"  y="178" fill="#66f4a0">PS/2</text>

    <rect x="90"  y="164" width="38" height="20" rx="3" fill="#2d1b38" stroke="#4a2d5e" stroke-width="0.8"/>
    <text x="109" y="178" fill="#c866f4">LCD</text>

    <rect x="132" y="164" width="38" height="20" rx="3" fill="#1b3828" stroke="#2d5e3e" stroke-width="0.8"/>
    <text x="151" y="178" fill="#66f4a0">IR</text>

    <rect x="174" y="164" width="58" height="20" rx="3" fill="#381b1b" stroke="#5e2d2d" stroke-width="0.8"/>
    <text x="203" y="178" fill="#f46666">Info</text>
  </g>

  <!-- Arrow -->
  <line x1="140" y1="184" x2="140" y2="192" stroke="#f39c12" stroke-opacity="0.4" stroke-width="1.5"/>
  <polygon points="137,191 143,191 140,196" fill="#f39c12" fill-opacity="0.4"/>

  <!-- Board I/O strip -->
  <rect x="48" y="196" width="184" height="22" rx="3" fill="#0d1b2a" stroke="#2a3a4a" stroke-width="0.8"/>
  <text x="140" y="211" text-anchor="middle" fill="#6a8da8" font-family="Consolas,monospace" font-size="9">DE2-115 Cyclone IV E</text>

  <!-- Footer stats inside left panel -->
  <g font-family="Consolas,monospace" font-size="9" text-anchor="middle">
    <text x="85"  y="248" fill="#f39c12" font-weight="700">148</text>
    <text x="85"  y="260" fill="#555" font-size="7.5">commits</text>
    <text x="140" y="248" fill="#00d4ff" font-weight="700">12</text>
    <text x="140" y="260" fill="#555" font-size="7.5">days</text>
    <text x="195" y="248" fill="#66f4a0" font-weight="700">~47%</text>
    <text x="195" y="260" fill="#555" font-size="7.5">FPGA</text>
  </g>


  <!-- ===== CENTER: Hero text ===== -->
  <rect x="300" y="100" width="680" height="120" fill="url(#glowGrad)" rx="8"/>

  <text x="640" y="128" text-anchor="middle" fill="#e0e0e0" font-family="'Segoe UI','Microsoft YaHei',Arial,sans-serif" font-size="72" font-weight="700" letter-spacing="2">
    DE2<tspan fill="#f39c12">Extra</tspan>
  </text>

  <text x="640" y="166" text-anchor="middle" fill="#888888" font-family="'Segoe UI','Microsoft YaHei',Arial,sans-serif" font-size="18" letter-spacing="3">
    RISC-V SoC on DE2-115 FPGA
  </text>

  <!-- Wishbone bus accent line -->
  <rect x="440" y="180" width="400" height="4" rx="2" fill="url(#busGrad)" opacity="0.7"/>

  <text x="640" y="210" text-anchor="middle" fill="#666666" font-family="'Segoe UI','Microsoft YaHei',Arial,sans-serif" font-size="14">
    NEORV32 · 10 active Wishbone 外设 · FreeRTOS · VGA 终端 · PS/2 键盘
  </text>


  <!-- ===== RIGHT PANEL: ISA + badges (x=1020..1240, w=220) ===== -->

  <rect x="1020" y="40" width="220" height="240" rx="8" fill="none" stroke="#222" stroke-width="1"/>

  <!-- Stats row — 3 items evenly in 220px -->
  <g font-family="Consolas,monospace" text-anchor="middle">
    <text x="1073" y="72" fill="#f39c12" font-size="24" font-weight="700">10</text>
    <text x="1073" y="86" fill="#555" font-size="8">外设</text>

    <text x="1137" y="72" fill="#00d4ff" font-size="24" font-weight="700">22</text>
    <text x="1137" y="86" fill="#555" font-size="8">命令</text>

    <text x="1200" y="72" fill="#66f4a0" font-size="24" font-weight="700">7h+</text>
    <text x="1200" y="86" fill="#555" font-size="8">稳定</text>
  </g>

  <!-- Divider -->
  <line x1="1036" y1="96" x2="1224" y2="96" stroke="#222" stroke-width="0.8"/>

  <!-- ISA label -->
  <text x="1028" y="114" fill="#555" font-family="Consolas,monospace" font-size="8" letter-spacing="1">ISA EXTENSIONS</text>

  <!-- ISA badges — 4 per row, 2 rows -->
  <g font-family="Consolas,monospace" font-size="9" text-anchor="middle">
    <rect x="1028" y="120" width="47" height="20" rx="4" fill="#1a1a2e" stroke="#2a2a4a" stroke-width="0.8"/>
    <text x="1051" y="134" fill="#c866f4">RV32IMC</text>

    <rect x="1079" y="120" width="47" height="20" rx="4" fill="#1a1a2e" stroke="#2a2a4a" stroke-width="0.8"/>
    <text x="1102" y="134" fill="#c866f4">Zicsr</text>

    <rect x="1130" y="120" width="47" height="20" rx="4" fill="#1a1a2e" stroke="#2a2a4a" stroke-width="0.8"/>
    <text x="1153" y="134" fill="#f4c866">Zbkb</text>

    <rect x="1181" y="120" width="47" height="20" rx="4" fill="#1a1a2e" stroke="#2a2a4a" stroke-width="0.8"/>
    <text x="1204" y="134" fill="#f4c866">Zbkc</text>

    <!-- Row 2 -->
    <rect x="1028" y="144" width="47" height="20" rx="4" fill="#1a1a2e" stroke="#2a2a4a" stroke-width="0.8"/>
    <text x="1051" y="158" fill="#f4c866">Zbkx</text>

    <rect x="1079" y="144" width="47" height="20" rx="4" fill="#1a1a2e" stroke="#2a2a4a" stroke-width="0.8"/>
    <text x="1102" y="158" fill="#f4c866">Zknd</text>

    <rect x="1130" y="144" width="47" height="20" rx="4" fill="#1a1a2e" stroke="#2a2a4a" stroke-width="0.8"/>
    <text x="1153" y="158" fill="#f4c866">Zkne</text>

    <rect x="1181" y="144" width="47" height="20" rx="4" fill="#1a1a2e" stroke="#2a2a4a" stroke-width="0.8"/>
    <text x="1204" y="158" fill="#f4c866">Zknh</text>
  </g>

  <!-- Divider -->
  <line x1="1036" y1="174" x2="1224" y2="174" stroke="#222" stroke-width="0.8"/>

  <!-- Highlights label -->
  <text x="1028" y="192" fill="#555" font-family="Consolas,monospace" font-size="8" letter-spacing="1">HIGHLIGHTS</text>

  <!-- Highlight badges -->
  <g font-family="Consolas,monospace" font-size="9" text-anchor="middle">
    <rect x="1028" y="198" width="95" height="20" rx="4" fill="rgba(243,156,18,0.08)" stroke="rgba(243,156,18,0.2)" stroke-width="0.8"/>
    <text x="1075" y="212" fill="#f39c12">100+x AES</text>

    <rect x="1127" y="198" width="101" height="20" rx="4" fill="rgba(102,244,160,0.08)" stroke="rgba(102,244,160,0.2)" stroke-width="0.8"/>
    <text x="1177" y="212" fill="#66f4a0">GPU 2D</text>

    <rect x="1028" y="222" width="95" height="20" rx="4" fill="rgba(200,102,244,0.08)" stroke="rgba(200,102,244,0.2)" stroke-width="0.8"/>
    <text x="1075" y="236" fill="#c866f4">VGA 80x30</text>

    <rect x="1127" y="222" width="101" height="20" rx="4" fill="rgba(102,244,160,0.08)" stroke="rgba(102,244,160,0.2)" stroke-width="0.8"/>
    <text x="1177" y="236" fill="#66f4a0">SM4 + SHA</text>
  </g>

  <!-- Bottom badges -->
  <rect x="1053" y="256" width="86" height="18" rx="4" fill="rgba(102,244,160,0.08)" stroke="rgba(102,244,160,0.25)" stroke-width="0.8"/>
  <text x="1096" y="269" text-anchor="middle" fill="#66f4a0" font-family="Consolas,monospace" font-size="9" font-weight="600">MIT License</text>

  <rect x="1145" y="256" width="66" height="18" rx="4" fill="rgba(243,156,18,0.08)" stroke="rgba(243,156,18,0.25)" stroke-width="0.8"/>
  <text x="1178" y="269" text-anchor="middle" fill="#f39c12" font-family="Consolas,monospace" font-size="9" font-weight="600">50 MHz</text>

  <!-- Bottom accent line -->
  <rect x="0" y="316" width="1280" height="4" fill="url(#busGrad)" opacity="0.5"/>
</svg>
