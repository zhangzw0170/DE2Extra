<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200">
<style>
  text{font-family:'Segoe UI','Microsoft YaHei',Arial,sans-serif}
  .t1{font-size:24px;fill:#e0e0e0;font-weight:700;text-anchor:middle}
  .t2{font-size:12px;fill:#888;text-anchor:middle}
  .badge{font-size:11px;font-weight:600;text-anchor:middle}
  .chip{font-size:11px;font-family:Consolas,monospace;text-anchor:middle;fill:#a8d8ea}
  .chip-hl{font-size:11px;font-family:Consolas,monospace;text-anchor:middle;fill:#95d5b2}
  .pn{font-size:12px;font-weight:600;text-anchor:middle}
  .pa{font-size:9px;font-family:Consolas,monospace;text-anchor:middle;opacity:.7}
  .pd{font-size:9px;text-anchor:middle;opacity:.6}
  .ion{font-size:11px;font-weight:600;text-anchor:middle;fill:#a8d8ea}
  .id{font-size:9px;text-anchor:middle;fill:#6a8da8}
  .sv{font-size:22px;font-weight:700;text-anchor:middle;fill:#f39c12}
  .sl{font-size:10px;text-anchor:middle;fill:#888}
  .fn{font-size:10px;text-anchor:middle;fill:#555}
</style>
<defs>
  <linearGradient id="gSW" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1a1a2e"/><stop offset="100%" stop-color="#16213e"/>
  </linearGradient>
  <linearGradient id="gCPU" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1a1a1a"/><stop offset="100%" stop-color="#2d2d2d"/>
  </linearGradient>
  <linearGradient id="gCPUB" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#e94560"/><stop offset="100%" stop-color="#c23152"/>
  </linearGradient>
  <linearGradient id="gWB" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#f39c12"/><stop offset="50%" stop-color="#e67e22"/><stop offset="100%" stop-color="#f39c12"/>
  </linearGradient>
  <linearGradient id="gIO" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0d1b2a"/><stop offset="100%" stop-color="#1b2838"/>
  </linearGradient>
</defs>

<!-- Background -->
<rect width="1200" height="790" fill="#0a0a0f"/>

<!-- Title -->
<text x="600" y="32" class="t1">DE2Extra — RISC-V 全外设终端系统</text>
<text x="600" y="52" class="t2">NEORV32 RV32IMC+Zk* on DE2-115 (Cyclone IV E) · 12 Wishbone slaves · FreeRTOS 4 tasks · 20 CLI commands</text>

<!-- ====== SOFTWARE LAYER ====== -->
<rect x="40" y="70" width="1120" height="118" rx="12" fill="url(#gSW)" stroke="#2a2a4a"/>
<rect x="440" y="80" width="320" height="22" rx="4" fill="#0f3460"/>
<text x="600" y="95" class="badge" fill="#a8d8ea">软件层 — FreeRTOS V11.3 + SDRAM 执行</text>

<!-- Row 1: 12 chips, 82px wide, 6px gap -->
<rect x="75" y="110" width="82" height="22" rx="4" fill="#1b4332" stroke="#2d6a4f"/>
<text x="116" y="125" class="chip-hl">hello</text>
<rect x="163" y="110" width="82" height="22" rx="4" fill="#0f3460" stroke="#1a5276"/>
<text x="204" y="125" class="chip">crypto</text>
<rect x="251" y="110" width="82" height="22" rx="4" fill="#0f3460" stroke="#1a5276"/>
<text x="292" y="125" class="chip">ps2</text>
<rect x="339" y="110" width="82" height="22" rx="4" fill="#0f3460" stroke="#1a5276"/>
<text x="380" y="125" class="chip">snake</text>
<rect x="427" y="110" width="82" height="22" rx="4" fill="#0f3460" stroke="#1a5276"/>
<text x="468" y="125" class="chip">conway</text>
<rect x="515" y="110" width="82" height="22" rx="4" fill="#0f3460" stroke="#1a5276"/>
<text x="556" y="125" class="chip">info</text>
<rect x="603" y="110" width="82" height="22" rx="4" fill="#0f3460" stroke="#1a5276"/>
<text x="644" y="125" class="chip">riscvasm</text>
<rect x="691" y="110" width="82" height="22" rx="4" fill="#0f3460" stroke="#1a5276"/>
<text x="732" y="125" class="chip">expdemo</text>
<rect x="779" y="110" width="82" height="22" rx="4" fill="#0f3460" stroke="#1a5276"/>
<text x="820" y="125" class="chip">twm</text>
<rect x="867" y="110" width="82" height="22" rx="4" fill="#0f3460" stroke="#1a5276"/>
<text x="908" y="125" class="chip">ntt</text>
<rect x="955" y="110" width="82" height="22" rx="4" fill="#0f3460" stroke="#1a5276"/>
<text x="996" y="125" class="chip">synth</text>
<rect x="1043" y="110" width="82" height="22" rx="4" fill="#1b4332" stroke="#2d6a4f"/>
<text x="1084" y="125" class="chip-hl">pforth</text>
<rect x="1131" y="110" width="90" height="22" rx="4" fill="#1b4332" stroke="#2d6a4f"/>
<text x="1176" y="125" class="chip-hl">cryptoviz</text>

<!-- Row 2: 7 chips -->
<rect x="295" y="140" width="82" height="22" rx="4" fill="#0f3460" stroke="#1a5276"/>
<text x="336" y="155" class="chip">selfcheck</text>
<rect x="383" y="140" width="82" height="22" rx="4" fill="#0f3460" stroke="#1a5276"/>
<text x="424" y="155" class="chip">stats</text>
<rect x="471" y="140" width="82" height="22" rx="4" fill="#0f3460" stroke="#1a5276"/>
<text x="512" y="155" class="chip">ver</text>
<rect x="559" y="140" width="82" height="22" rx="4" fill="#0f3460" stroke="#1a5276"/>
<text x="600" y="155" class="chip">clear</text>
<rect x="647" y="140" width="82" height="22" rx="4" fill="#0f3460" stroke="#1a5276"/>
<text x="688" y="155" class="chip">pxtest</text>
<rect x="735" y="140" width="82" height="22" rx="4" fill="#0f3460" stroke="#1a5276"/>
<text x="776" y="155" class="chip">vgadump</text>
<rect x="823" y="140" width="82" height="22" rx="4" fill="#0f3460" stroke="#1a5276"/>
<text x="864" y="155" class="chip">vgamon</text>

<text x="600" y="178" font-size="10" fill="#666" text-anchor="middle">4 FreeRTOS 任务: t_uart_input / t_shell / t_active / t_status | F1=帮助 F10=退出</text>

<!-- Connector arrow 1 -->
<line x1="600" y1="190" x2="600" y2="206" stroke="#f39c12" stroke-width="2" opacity=".5"/>
<polygon points="594,206 606,206 600,214" fill="#f39c12" opacity=".6"/>

<!-- ====== CPU + BUS LAYER ====== -->
<rect x="40" y="216" width="1120" height="340" rx="12" fill="url(#gCPU)" stroke="#3a3a3a"/>

<!-- CPU block -->
<rect x="350" y="230" width="500" height="58" rx="10" fill="url(#gCPUB)"/>
<text x="600" y="252" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">NEORV32 RISC-V</text>
<text x="600" y="268" font-size="10" fill="#fff" opacity=".8" text-anchor="middle">RV32IMC + Zicsr + Zicntr + Zbkb/Zbkc/Zbkx + Zknd/Zkne/Zknh</text>
<text x="600" y="280" font-size="10" fill="#fff" opacity=".8" text-anchor="middle">50MHz | IMEM 64KB | DMEM 16KB | UART 115200 | GPIO 32-bit | TRNG</text>

<!-- XBUS label -->
<rect x="370" y="298" width="460" height="18" rx="4" fill="#444"/>
<text x="600" y="312" font-size="10" fill="#f39c12" font-family="Consolas,monospace" text-anchor="middle">XBUS Master | timeout 2048 cycles | burst cti/tag</text>

<!-- Wishbone Bus bar -->
<rect x="300" y="324" width="600" height="34" rx="8" fill="url(#gWB)"/>
<text x="600" y="344" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle" letter-spacing="2">WISHBONE BUS — 1 主 / 12 从</text>
<text x="600" y="354" font-size="9" fill="#2c2c2c" text-anchor="middle">32-bit 数据 | 组合地址解码 | wb_intercon.vhd</text>

<!-- ====== PERIPHERAL GRID (6 cols × 2 rows) ====== -->
<!-- Row 1 -->
<rect x="64" y="370" width="172" height="62" rx="8" fill="#1b2838" stroke="#2a475e"/>
<text x="150" y="392" class="pn" fill="#66c0f4">SDRAM</text>
<text x="150" y="404" class="pa" fill="#66c0f4">0x01000000</text>
<text x="150" y="416" class="pd" fill="#66c0f4">128MB | burst | async FIFO</text>

<rect x="244" y="370" width="172" height="62" rx="8" fill="#2d1b38" stroke="#4a2d5e"/>
<text x="330" y="392" class="pn" fill="#c866f4">VGA 终端</text>
<text x="330" y="404" class="pa" fill="#c866f4">0xF0000000</text>
<text x="330" y="416" class="pd" fill="#c866f4">80×30 文本 + 像素 RGB565</text>

<rect x="424" y="370" width="172" height="62" rx="8" fill="#1b3828" stroke="#2d5e3e"/>
<text x="510" y="392" class="pn" fill="#66f4a0">PS/2 键盘</text>
<text x="510" y="404" class="pa" fill="#66f4a0">0xF0008000</text>
<text x="510" y="416" class="pd" fill="#66f4a0">scancode + IRQ</text>

<rect x="604" y="370" width="172" height="62" rx="8" fill="#381b1b" stroke="#5e2d2d"/>
<text x="690" y="392" class="pn" fill="#f46666">BuildInfo</text>
<text x="690" y="404" class="pa" fill="#f46666">0xF0009000</text>
<text x="690" y="416" class="pd" fill="#f46666">HW/SW 版本 ROM</text>

<rect x="784" y="370" width="172" height="62" rx="8" fill="#381b1b" stroke="#5e2d2d"/>
<text x="870" y="392" class="pn" fill="#f46666">INTC</text>
<text x="870" y="404" class="pa" fill="#f46666">0xF000A000</text>
<text x="870" y="416" class="pd" fill="#f46666">中断控制器 (reserved)</text>

<rect x="964" y="370" width="172" height="62" rx="8" fill="#2d1b38" stroke="#4a2d5e"/>
<text x="1050" y="392" class="pn" fill="#c866f4">LCD</text>
<text x="1050" y="404" class="pa" fill="#c866f4">0xF000B000</text>
<text x="1050" y="416" class="pd" fill="#c866f4">HD44780 16×2</text>

<!-- Row 2 -->
<rect x="64" y="440" width="172" height="62" rx="8" fill="#1b3828" stroke="#2d5e3e"/>
<text x="150" y="462" class="pn" fill="#66f4a0">IR 红外</text>
<text x="150" y="474" class="pa" fill="#66f4a0">0xF000C000</text>
<text x="150" y="486" class="pd" fill="#66f4a0">NEC 解码</text>

<rect x="244" y="440" width="172" height="62" rx="8" fill="#38291b" stroke="#5e4a2d"/>
