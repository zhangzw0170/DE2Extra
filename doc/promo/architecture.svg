<rect x="413" y="515" width="10" height="10" rx="2" fill="#66f4a0" stroke="#2d5e3e"/>
<text x="428" y="524" font-size="10" fill="#aaa">输入</text>
<rect x="493" y="515" width="10" height="10" rx="2" fill="#f4c866" stroke="#5e4a2d"/>
<text x="508" y="524" font-size="10" fill="#aaa">加速器</text>
<rect x="593" y="515" width="10" height="10" rx="2" fill="#f46666" stroke="#5e2d2d"/>
<text x="608" y="524" font-size="10" fill="#aaa">系统</text>
<rect x="673" y="515" width="10" height="10" rx="2" fill="#66e0f4" stroke="#2d5a6e"/>
<text x="688" y="524" font-size="10" fill="#aaa">音频</text>

