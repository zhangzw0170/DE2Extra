<text x="330" y="474" class="pa" fill="#f4c866">0xF000F000</text>
<text x="330" y="486" class="pd" fill="#f4c866">ML-KEM-512 | q=3329</text>

<rect x="424" y="440" width="172" height="62" rx="8" fill="#38291b" stroke="#5e4a2d"/>
<text x="510" y="462" class="pn" fill="#f4c866">ExpDemo</text>
<text x="510" y="474" class="pa" fill="#f4c866">0xF0010000</text>
<text x="510" y="486" class="pd" fill="#f4c866">13 个实验多路复用</text>

<rect x="604" y="440" width="172" height="62" rx="8" fill="#38291b" stroke="#5e4a2d"/>
<text x="690" y="462" class="pn" fill="#f4c866">Conway 引擎</text>
<text x="690" y="474" class="pa" fill="#f4c866">0xF0011000</text>
<text x="690" y="486" class="pd" fill="#f4c866">64×25 | LE 寄存器</text>

<rect x="784" y="440" width="172" height="62" rx="8" fill="#1b2e38" stroke="#2d5a6e"/>
<text x="870" y="462" class="pn" fill="#66e0f4">Synth 音频</text>
<text x="870" y="474" class="pa" fill="#66e0f4">0xF0012000</text>
<text x="870" y="486" class="pd" fill="#66e0f4">3xOSC + DX7 FM | WM8731</text>

<rect x="964" y="440" width="172" height="62" rx="8" fill="#38291b" stroke="#5e4a2d"/>
<text x="1050" y="462" class="pn" fill="#f4c866">GPU 2D</text>
<text x="1050" y="474" class="pa" fill="#f4c866">0xF0015000</text>
<text x="1050" y="486" class="pd" fill="#f4c866">FILL rect | burst 写</text>

