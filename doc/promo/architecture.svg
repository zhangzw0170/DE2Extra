<!-- Footer -->
<text x="600" y="778" class="fn">Boot mode 0: 2KB bootloader (IMEM) → UART upload → SDRAM exec (0x01000000) | FreeRTOS heap @ 0x01900000 | Framebuffer @ 0x01800000</text>
