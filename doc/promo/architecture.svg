<rect x="40" y="582" width="1120" height="110" rx="12" fill="url(#gIO)" stroke="#2a3a4a"/>
<rect x="340" y="592" width="520" height="22" rx="4" fill="#162030"/>
<text x="600" y="607" class="badge" fill="#a8d8ea">DE2-115 板级 I/O — Cyclone IV E (EP4CE115F29C7, 114K LEs)</text>

